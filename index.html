<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>IT105 Capture the Knowledge</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#020604;color:#d9ffe7;font:15px Consolas,monospace}body:before{content:"";position:fixed;inset:0;background:linear-gradient(#00ff7308 1px,transparent 1px);background-size:100% 24px;pointer-events:none}.start{position:fixed;inset:0;display:grid;place-items:center;background:#010503f5;z-index:5}.card,.box{border:1px solid #00ff73;background:#03100a;padding:28px;box-shadow:0 0 35px #00ff7330}.card{width:min(800px,90%)}h1{color:#fff;font-size:clamp(30px,6vw,60px)}.g{color:#00ff73}.c{color:#00dfff}.input{width:100%;padding:14px;background:#010503;border:1px solid #00ff73;color:#fff;font:15px Consolas}.btn{padding:13px 18px;background:#03160c;border:1px solid #00ff73;color:#00ff73;font:bold 12px Consolas;cursor:pointer;margin-top:10px}.wrap{width:min(1200px,94%);margin:auto;padding:20px}.hud{display:flex;justify-content:space-between;flex-wrap:wrap;padding:12px;border:1px solid #145d39}.grid{display:grid;grid-template-columns:230px 1fr 190px;gap:12px;margin-top:12px}.box{padding:20px}.mission{padding:8px;border:1px solid #164c34;margin:5px 0;font-size:11px}.active{border-color:#00ff73}.done{color:#00ff73}.q{font-size:18px;line-height:1.7}.hint{margin-top:15px;border:1px solid #174b34;padding:10px;color:#789d86;cursor:pointer}.hint div{display:none;margin-top:8px;color:#b8d4c1}.ans{display:flex;gap:8px;margin-top:16px}.ans input{flex:1;padding:13px;background:#010503;border:1px solid #00ff73;color:white;font:15px Consolas}.score{font-size:36px;color:#00ff73}.bad{color:#ff526a}.good{color:#00ff73}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><div class="start" id="start"><div class="card"><div class="g">CSUCC // IT105 // NETWORKING II</div><h1>CAPTURE THE KNOWLEDGE</h1><div class="c">CTF // NETWORK OPERATIVE TRAINING</div><p>15 challenges • 18 points • live classroom ranking</p><p class="g">TEAM IDENTIFICATION</p><input class="input" id="team" placeholder="ENTER TEAM NAME" maxlength="30"><br><button class="btn" onclick="begin()">[ START CTF ]</button></div></div><div class="wrap"><div class="hud"><span class="g">● LIVE</span><span>TEAM: <b id="tn">---</b></span><span>SCORE: <b id="sh">0 / 18</b></span></div><div class="grid"><div class="box"><b class="g">MISSION LIST</b><div id="list"></div></div><div class="box"><div class="c" id="cat"></div><h2 id="ttl"></h2><p class="q" id="q"></p><div class="hint" onclick="hint()">[ + ] OPEN HINT<div id="ht"></div></div><div class="ans"><input id="a" placeholder="TYPE ANSWER"><button class="btn" onclick="submitAnswer()">SUBMIT</button></div><p id="fb"></p><div id="done" style="display:none;text-align:center;padding:60px"><h1 class="g">MISSION COMPLETE</h1></div></div><div class="box"><div class="g">LIVE SCORE</div><p class="score" id="bs">0</p><p>SOLVED <b id="sv">0 / 15</b></p><p>CURRENT <b id="cur">01</b></p></div></div></div><script>
const db=supabase.createClient("https://rhhijqcsryqfcmysopxr.supabase.co","sb_publishable_-Wdl-SdwCmR1YB_GIB-Kkg_cA_09H-B");
const C=[["DHCP","A client automatically receives an IP address, subnet mask, gateway, and DNS information. Which service provides these settings?","Think automatic network configuration."],["DNS","A user types a server name and the network translates the name into an IP address. What service is responsible?","Think name-to-IP translation."],["ACTIVE DIRECTORY","Which Windows Server technology centrally manages users, groups, computers, organizational units, and domain settings?","Think centralized Windows domain management."],["SERVER MANAGER","Which Windows Server management tool is used to add roles and features?","Recall Manage > Add Roles and Features."],["COMPUTER NAME","Unscramble: PUTMOCER AMNE. What server setting identifies the computer?","Rearrange the letters into two words."],["HYPER-V","Which Windows Server technology is used to create and manage virtual machines?","Think Windows virtualization."],["POWERSHELL","Which Windows command-line tool is used for server administration and automation?","Recall Get-Service, Get-ComputerInfo, and Get-Help."],["DOMAIN CONTROLLER","Which Windows Server role manages users and computers inside a Windows domain?","Think about the server that controls a domain."],["FILE SERVER","Unscramble: LIFE RSVRE. Which server role provides shared files and folders?","Rearrange the letters into a server role."],["WEB SERVER","Which server role provides websites and web services?","Think websites and web services."],["LOCAL SERVER","Where can an administrator review Computer Name, Workgroup, Network Settings, and Remote Management?","Think Windows Server basic settings."],["WINDOWS 2000 SERVER","Decode ROT13: Jvaqbjf 2000 Freire. What Windows Server version is hidden?","Use ROT13: A↔N through M↔Z."],["ORGANIZATIONAL UNITS","In Active Directory, what structure is used to organize users and computers into manageable groups?","Think containers used to organize AD objects."],["WINDOWS FIREWALL","Which built-in Windows component protects network traffic by filtering connections?","Think Windows firewall."],["POWERSHELL","Which command-based Windows tool can configure server roles and automate repeated administration tasks?","Think command-line administration."]];
let i=0,s=0,t="",id="",tries=3,done=Array(C.length).fill(false);
const n=x=>String(x||"").toLowerCase().trim().replace(/\s+/g," ");
async function sync(status="IN PROGRESS"){if(!t)return;await db.from("teams").upsert({team_id:id,team_name:t,score:s,max_score:18,solved:done.filter(Boolean).length,total_challenges:15,current_challenge:i+1,status},{onConflict:"team_id"})}
function draw(){list.innerHTML=C.map((x,k)=>"<div class='mission "+(k===i?"active ":"")+(done[k]?"done":"")+"'>"+String(k+1).padStart(2,"0")+" // "+x[0]+"</div>").join("");sh.textContent=s+" / 18";bs.textContent=s;sv.textContent=done.filter(Boolean).length+" / 15";cur.textContent=String(i+1).padStart(2,"0")}
function render(){let x=C[i];tries=i===12||i===14?5:3;cat.textContent=(tries===5?"HARD":"MEDIUM")+" // "+tries+" ATTEMPTS";ttl.textContent=x[0];q.textContent=x[1];ht.textContent=x[2];ht.style.display="none";a.value="";a.disabled=false;fb.textContent="";draw();sync()}
function begin(){let x=team.value.trim().replace(/\s+/g," ");if(x.length<2)return alert("Enter a team name.");t=x.toUpperCase();id=sessionStorage.getItem("it105_id")||"team-"+Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,7);sessionStorage.setItem("it105_id",id);tn.textContent=t;start.style.display="none";render()}
async function submitAnswer(){let x=C[i],ok=n(a.value)===n(x[0]);if(!a.value.trim())return;if(ok){s+=i>=12?2:1;done[i]=true;fb.className="good";fb.textContent="ACCESS GRANTED — CORRECT. NEXT LEVEL UNLOCKED.";draw();await sync(i===14?"COMPLETED":"IN PROGRESS");if(i===14){a.disabled=true;done.style.display="block"}else setTimeout(()=>{i++;render()},500)}else{tries--;s=Math.max(0,s-(i>=12?1:.5));fb.className="bad";fb.textContent="ACCESS DENIED — INCORRECT. ATTEMPTS LEFT: "+tries;draw();await sync(tries?"IN PROGRESS":"LOCKED");if(!tries)a.disabled=true}}
function hint(){ht.style.display=ht.style.display==="block"?"none":"block"}team.addEventListener("keydown",e=>{if(e.key==="Enter")begin()});
</script></body></html>
